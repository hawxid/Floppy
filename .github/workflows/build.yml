name: Build FloppyKernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---------- Dependencies ----------
      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 zip unzip curl wget \
            ccache patch rsync \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld

      # ---------- Download Clang 23 hardcoded ----------
      - name: Download AOSP Clang r614150 (Clang 23.0.1)
        run: |
          CLANG_DIR="/home/runner/aosp-clang"
          mkdir -p "$CLANG_DIR"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/28337064939c0b4bb5804cddf35fb03d860edcf6/clang-r614150.tar.gz"

          echo "📥 Downloading: $URL"
          if ! curl -fLSsS --retry 3 --retry-delay 5 -o /tmp/clang.tar.gz "$URL"; then
            echo "❌ Download failed"; exit 1
          fi

          echo "--- file type ---"
          file /tmp/clang.tar.gz
          ls -lh /tmp/clang.tar.gz

          if ! tar -xf /tmp/clang.tar.gz -C "$CLANG_DIR"; then
            echo "❌ Extract failed"; exit 1
          fi
          rm -f /tmp/clang.tar.gz

          # Placeholder elfedit
          touch "$CLANG_DIR/bin/aarch64-linux-gnu-elfedit"
          touch "$CLANG_DIR/bin/arm-linux-gnueabi-elfedit"
          chmod +x "$CLANG_DIR/bin/aarch64-linux-gnu-elfedit"
          chmod +x "$CLANG_DIR/bin/arm-linux-gnueabi-elfedit"

          echo "--- verifikasi clang ---"
          "$CLANG_DIR/bin/clang" --version | head -1
          test -f "$CLANG_DIR/bin/clang" || { echo "❌ clang binary nggak ada"; exit 1; }
          echo "✅ Clang siap"

      # ---------- Apply patch NetHunter ----------
      - name: Apply packet_inject.patch
        run: |
          PATCH_FILE="patch/packet_inject.patch"
          applied=0

          if git apply --3way --whitespace=nowarn "$PATCH_FILE"; then
            echo "✅ Applied via git apply --3way"
            applied=1
          else
            echo "⚠️ --3way failed, rolling back"
            git checkout -- . 2>/dev/null || true
            git clean -fd drivers/staging/qcacld-3.0 \
                          drivers/staging/qca-wifi-host-cmn 2>/dev/null || true
          fi

          if [ "$applied" = "0" ]; then
            echo "⚠️ fallback ke patch -p1 --fuzz=3"
            patch -p1 -N --forward --fuzz=3 --no-backup-if-mismatch \
              < "$PATCH_FILE" || true
          fi

          echo "--- .rej ---"
          find . -name '*.rej' -print || true
          find . -name '*.rej' -delete

      - name: Fix header include paths
        run: |
          QCA="drivers/staging/qcacld-3.0"
          ROOT_INC="$QCA/inc"
          HDD_INC="$QCA/core/hdd/inc"
          WMA_INC="$QCA/core/wma/inc"

          for f in wlan_hdd_frame_inject.h \
                   wlan_hdd_frame_validate.h \
                   wlan_hdd_inject_security.h \
                   wlan_hdd_frame_inject_debug.h; do
            if [ -f "$HDD_INC/$f" ]; then
              cp -f "$HDD_INC/$f" "$ROOT_INC/$f"
              echo "✅ hdd→inc/: $f"
            fi
          done

          if [ -f "$WMA_INC/wma_frame_inject.h" ]; then
            cp -f "$WMA_INC/wma_frame_inject.h" "$ROOT_INC/"
            cp -f "$WMA_INC/wma_frame_inject.h" "$HDD_INC/"
            echo "✅ wma→inc/ + hdd/inc/: wma_frame_inject.h"
          fi

          test -f "$ROOT_INC/wma_frame_inject.h" \
            || { echo "❌ wma_frame_inject.h nggak ke-copy"; exit 1; }
          test -f "$ROOT_INC/wlan_hdd_frame_inject.h" \
            || { echo "❌ wlan_hdd_frame_inject.h nggak ke-copy"; exit 1; }
          echo "✅ Semua header ke-copy"

      - name: Verify Injection
        run: |
          test -f drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c \
            || { echo "❌ wma_frame_inject.c hilang"; exit 1; }
          test -f drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c \
            || { echo "❌ wlan_hdd_frame_inject.c hilang"; exit 1; }
          echo "✅ Patch sukses"

      - name: Fix Script Permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      # ---------- Build pakai Clang custom ----------
      - name: Build Kernel (XXKSU + NetHunter)
        env:
          LOG_UPLOAD: 0
          CLANG_TYPE: custom
          CUST_DIR: /home/runner/aosp-clang
        run: |
          export WP="$(realpath "$PWD/..")"
          echo "🚀 Building FloppyKernel XXKSU + NetHunter for Ginkgo..."
          echo "   Toolchain: AOSP Clang 23.0.1 (custom)"
          set -o pipefail
          bash build/ckbuild.sh mitrinket x c 2>&1 | tee build.log

      # ---------- Artifacts ----------
      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-Ginkgo
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          overwrite: true
