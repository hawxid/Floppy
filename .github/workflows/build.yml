name: Build FloppyKernel

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Device (ginkgo | laurel_sprout | mitrinket)'
        required: false
        default: 'mitrinket'
      build_flags:
        description: 'ckbuild flags (contoh: "x c" = XXKSU + clean)'
        required: false
        default: 'x c'

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    # Env global — dibaca oleh ckbuild.sh / tc.sh / build.sh
    env:
      LOG_UPLOAD: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---------- Cache ccache (opsional, mempercepat build berikutnya) ----------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ---------- Apply patch NetHunter ----------
      - name: Apply packet_inject.patch
        run: |
          PATCH_FILE="patch/packet_inject.patch"
          applied=0

          if git apply --3way --whitespace=nowarn "$PATCH_FILE"; then
            echo "✅ Applied via git apply --3way"
            applied=1
          else
            echo "⚠️ --3way failed, rolling back"
            git checkout -- . 2>/dev/null || true
            git clean -fd drivers/staging/qcacld-3.0 \
                          drivers/staging/qca-wifi-host-cmn 2>/dev/null || true
          fi

          if [ "$applied" = "0" ]; then
            echo "⚠️ fallback ke patch -p1 --fuzz=3"
            patch -p1 -N --forward --fuzz=3 --no-backup-if-mismatch \
              < "$PATCH_FILE" || true
          fi

          echo "--- .rej ---"
          find . -name '*.rej' -print || true
          find . -name '*.rej' -delete

      - name: Fix header include paths
        run: |
          QCA="drivers/staging/qcacld-3.0"
          ROOT_INC="$QCA/inc"
          HDD_INC="$QCA/core/hdd/inc"
          WMA_INC="$QCA/core/wma/inc"

          for f in wlan_hdd_frame_inject.h \
                   wlan_hdd_frame_validate.h \
                   wlan_hdd_inject_security.h \
                   wlan_hdd_frame_inject_debug.h; do
            if [ -f "$HDD_INC/$f" ]; then
              cp -f "$HDD_INC/$f" "$ROOT_INC/$f"
              echo "✅ hdd→inc/: $f"
            fi
          done

          if [ -f "$WMA_INC/wma_frame_inject.h" ]; then
            cp -f "$WMA_INC/wma_frame_inject.h" "$ROOT_INC/"
            cp -f "$WMA_INC/wma_frame_inject.h" "$HDD_INC/"
            echo "✅ wma→inc/ + hdd/inc/: wma_frame_inject.h"
          fi

          test -f "$ROOT_INC/wma_frame_inject.h" \
            || { echo "❌ wma_frame_inject.h nggak ke-copy"; exit 1; }
          test -f "$ROOT_INC/wlan_hdd_frame_inject.h" \
            || { echo "❌ wlan_hdd_frame_inject.h nggak ke-copy"; exit 1; }
          echo "✅ Semua header ke-copy"

      - name: Verify Injection
        run: |
          test -f drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c \
            || { echo "❌ wma_frame_inject.c hilang"; exit 1; }
          test -f drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c \
            || { echo "❌ wlan_hdd_frame_inject.c hilang"; exit 1; }
          echo "✅ Patch sukses"

      - name: Fix Script Permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh 2>/dev/null || true
          chmod +x build/lib/*.sh 2>/dev/null || true
      #-----------------&build----------
      - name: Build Kernel
        run: |
          set -o pipefail

          DEVICE="${{ inputs.target_device }}"
          FLAGS="${{ inputs.build_flags }}"

          echo "🚀 Building FloppyKernel"
          echo "   Device : $DEVICE"
          echo "   Flags  : $FLAGS"
          echo "   (deps + toolchain di-handle oleh ckbuild.sh)"

          # shellcheck disable=SC2086
          bash build/ckbuild.sh "$DEVICE" $FLAGS 2>&1 | tee build.log

      # ---------- Artifacts ----------
      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-${{ inputs.target_device }}-${{ inputs.build_flags }}
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          overwrite: true
