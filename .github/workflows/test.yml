name: Build FloppyKernel +patch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---------- Ambil driver dari ikteach/ginkgo_Kernel ----------
      - name: cek aply
        run: |
          git apply --check patch/packet_inject.patch
          
      
