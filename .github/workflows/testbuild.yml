name: Build FloppyKernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---------- Dependencies ----------
      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt upgrade
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 zip curl ccache patch \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld

      # ---------- NetHunter Patches ----------
      - name: Download NetHunter Patches
        run: |
          mkdir -p patches/nethunter
          BASE="https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder/-/raw/main/patches/4.14"
          curl -fL -o patches/nethunter/001-add-qcacld-3.0-injection-4.14.patch \
            "$BASE/add-qcacld-3.0-injection-4.14.patch"
          ls -lh patches/nethunter/

      - name: Apply NetHunter Patches
        run: |
          shopt -s nullglob
          for p in patches/nethunter/*.patch; do
            echo "📌 Applying $p"
            if patch -p1 --fuzz=3 --no-backup-if-mismatch < "$p"; then
              echo "✅ applied: $p"
            else
              echo "⚠️ partial/failed: $p (continuing)"
            fi
          done
          echo "--- remaining rejects (if any) ---"
          find . -name '*.rej' -print || true

      - name: Verify Injection Symbols
        run: |
          if grep -Rq "wma_frame_inject" drivers/staging/qcacld-3.0/core/wma/src/ 2>/dev/null; then
            echo "✅ NetHunter injection code present"
          else
            echo "❌ Injection code NOT present — patch did not apply cleanly"
            echo "The kernel will still build but WITHOUT monitor-mode / frame-injection."
            exit 1
          fi

      # ---------- Script permissions ----------
      - name: Fix Script Permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh 2>/dev/null || true
          chmod +x build/lib/*.sh 2>/dev/null || true

      # ---------- Build ----------
      - name: Build Kernel (XXKSU + NetHunter)
        env:
          LOG_UPLOAD: 0
        run: |
          export WP="$(realpath "$PWD/..")"
          echo "🚀 Building FloppyKernel XXKSU + NetHunter for Ginkgo..."
          set -o pipefail
          bash build/ckbuild.sh ginkgo x 2>&1 | tee build.log

      # ---------- Artifacts ----------
      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-Ginkgo
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          overwrite: true
