name: Build FloppyKernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      WP: /home/runner/work/Floppy
      CLANG_VER: clang-r614150
      CLANG_COMMIT: 131f4e02e5889bfd7611eb0f3aad048efa7aed81
      CLANG_BASE: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # Restore toolchain cache (biar run kedua nggak download ulang)
      # ============================================================
      - name: Restore toolchain cache
        id: tc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WP }}/toolchains
          key: tc-aosp-${{ env.CLANG_VER }}-${{ runner.os }}
          restore-keys: |
            tc-aosp-${{ env.CLANG_VER }}-
            tc-aosp-

      # ============================================================
      # Pre-populate AOSP Clang (mirror bachnxuan + fallback Google)
      # ============================================================
      - name: Pre-populate AOSP Clang ${{ env.CLANG_VER }}
        run: |
          set -euo pipefail
          AC_DIR="$WP/toolchains/aospclang"

          if [[ -d "$AC_DIR" && -x "$AC_DIR/bin/clang" ]]; then
            echo "✅ Clang sudah ada di cache: $AC_DIR"
            "$AC_DIR/bin/clang" --version | head -n1
            exit 0
          fi

          echo "⬇️  Downloading AOSP Clang $CLANG_VER via GitHub mirror..."

          MIRRORS=(
            "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r614150-16165221/clang-r614150.tar.gz"
            "$CLANG_BASE/$CLANG_COMMIT/$CLANG_VER.tar.gz"
          )

          TMP_TAR="$(mktemp -d)/clang.tar.gz"
          DOWNLOADED=0

          for URL in "${MIRRORS[@]}"; do
            echo "   Trying: $URL"
            if curl -fLSs --retry 3 --retry-delay 5 --max-time 600 \
                  -o "$TMP_TAR" "$URL"; then
              SIZE=$(stat -c%s "$TMP_TAR" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 104857600 ]; then
                echo "✅ Download OK dari: $URL ($SIZE bytes)"
                DOWNLOADED=1
                break
              fi
              echo "⚠️ File terlalu kecil ($SIZE bytes), skip"
            fi
          done

          if [ "$DOWNLOADED" = "0" ]; then
            echo "❌ Semua mirror gagal"
            exit 1
          fi

          echo "📦 Extracting..."
          mkdir -p "$AC_DIR"
          tar -xf "$TMP_TAR" -C "$AC_DIR"
          rm -f "$TMP_TAR"

          touch "$AC_DIR/bin/aarch64-linux-gnu-elfedit" "$AC_DIR/bin/arm-linux-gnueabi-elfedit"
          chmod +x "$AC_DIR/bin/"*elfedit

          test -x "$AC_DIR/bin/clang" || { echo "❌ bin/clang tidak ada"; exit 1; }
          echo "✅ Clang siap:"
          "$AC_DIR/bin/clang" --version | head -n1

      # ---------- Ambil driver dari ikteach/ginkgo_Kernel ----------
      - name: Fetch Ikteach WiFi Drivers
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/ikteach/ginkgo_Kernel.git ikteach-kernel
          cd ikteach-kernel
          git sparse-checkout set \
            drivers/staging/qcacld-3.0 \
            drivers/staging/qca-wifi-host-cmn
          cd ..

      - name: Replace WiFi Driver Directories
        run: |
          rm -rf drivers/staging/qcacld-3.0
          rm -rf drivers/staging/qca-wifi-host-cmn
          cp -a ikteach-kernel/drivers/staging/qcacld-3.0 drivers/staging/
          cp -a ikteach-kernel/drivers/staging/qca-wifi-host-cmn drivers/staging/
          echo "✅ WiFi drivers replaced with ikteach versions."
          ls -lh drivers/staging/qcacld-3.0/ | head -3
          ls -lh drivers/staging/qca-wifi-host-cmn/ | head -3

      # ---------- Patch kompatibilitas kernel 4.14 ----------
      - name: Patch ktime_get_boot_ns (compat 4.14)
        run: |
          echo "🔧 Mengganti ktime_get_boot_ns() → ktime_get_boottime_ns()"
          FILES=$(grep -rl "ktime_get_boot_ns" \
            drivers/staging/qcacld-3.0 \
            drivers/staging/qca-wifi-host-cmn 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "✅ Tidak ada file yang perlu dipatch."
            exit 0
          fi
          echo "📄 File yang akan dipatch:"
          echo "$FILES"
          for f in $FILES; do
            sed -i 's/\([^_]\)ktime_get_boot_ns/\1ktime_get_boottime_ns/g' "$f"
            echo "   ✅ $f"
          done
          echo "🔍 Verifikasi:"
          grep -rn "ktime_get_boottime_ns" \
            drivers/staging/qcacld-3.0 \
            drivers/staging/qca-wifi-host-cmn | head -10 || true

      # ---------- Dependencies ----------
      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          git make bc bison flex libssl-dev libelf-dev \
          libncurses-dev python3 zip curl ccache \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang llvm lld

      - name: Fix Script Permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true
      - name: Fix Clang 23 enum-cast errors
        run: |
          echo "🔧 Fix Clang 23 -Wimplicit-enum-enum-cast..."

          # 1. Fix file yang sudah error
          F="drivers/staging/qca-wifi-host-cmn/hif/src/ce/ce_main.c"
          if [ -f "$F" ]; then
            sed -i 's/return A_ERROR;/return (QDF_STATUS)A_ERROR;/g' "$F"
            echo "✅ $F dipatch"
          fi

          # 2. Matiin warning di Makefile root kernel (global)
          if ! grep -q "Wno-implicit-enum-enum-cast" Makefile; then
            # Sisipkan setelah baris KBUILD_CFLAGS pertama
            sed -i '/^KBUILD_CFLAGS +=/i KBUILD_CFLAGS += -Wno-implicit-enum-enum-cast' Makefile
            echo "✅ Flag global ditambah ke Makefile"
          fi

          # 3. Tambah juga ke Kbuild qcacld + qca-wifi-host-cmn
          for d in qcacld-3.0 qca-wifi-host-cmn; do
            K="drivers/staging/$d/Kbuild"
            if [ -f "$K" ] && ! grep -q "Wno-implicit-enum-enum-cast" "$K"; then
              echo "ccflags-y += -Wno-implicit-enum-enum-cast" >> "$K"
              echo "✅ Flag ditambah ke $K"
            fi
          done

          # Verifikasi
          grep -c "Wno-implicit-enum-enum-cast" Makefile

      # ---------- Build ----------
      - name: Build Kernel (XXKSU + NetHunter)
        env:
          LOG_UPLOAD: 0
        run: |
          export WP="$(realpath "$PWD/..")"
          echo "🚀 Building FloppyKernel XXKSU + NetHunter for Ginkgo..."
          set -o pipefail
          bash build/ckbuild.sh ginkgo x c 2>&1 | tee build.log

      # ============================================================
      # Save toolchain cache
      # ============================================================
      - name: Save toolchain cache
        if: always() && steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WP }}/toolchains
          key: tc-aosp-${{ env.CLANG_VER }}-${{ runner.os }}

      # ---------- Artifacts ----------
      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-NetHunter-Ginkgo
          path: build/Floppy_*.zip
          if-no-files-found: error
          overwrite: true

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          overwrite: true
