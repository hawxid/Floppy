name: test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1


      # ---------- Apply patch NetHunter ----------
      - name: Apply packet_inject.patch
        run: |
          git apply --check patch/test.patch
          
